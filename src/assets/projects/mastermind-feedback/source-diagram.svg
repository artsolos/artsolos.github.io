<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Mastermind: avoid counting a digit twice</title><desc id="desc">Source: code.cpp and mastermind.cpp, Parts A/B. Illustration, not gameplay output.</desc><rect width="1200" height="720" rx="18" fill="#121A24"/><g font-family="Arial, sans-serif"><text x="48" y="60" fill="#F2F5F8" font-size="32" font-weight="600">Mastermind: avoid counting a digit twice</text><text x="58" y="130" fill="#A5B2C1" font-size="22" font-weight="400">Illustrative secret</text><text x="58" y="260" fill="#A5B2C1" font-size="22" font-weight="400">Illustrative guess</text><rect x="60" y="150" width="82" height="82" rx="10" fill="#203849" stroke="#6B7F96"/><text x="90" y="204" fill="#F2F5F8" font-size="36" font-weight="400">1</text><rect x="165" y="150" width="82" height="82" rx="10" fill="#182230" stroke="#6B7F96"/><text x="195" y="204" fill="#F2F5F8" font-size="36" font-weight="400">1</text><rect x="270" y="150" width="82" height="82" rx="10" fill="#182230" stroke="#6B7F96"/><text x="300" y="204" fill="#F2F5F8" font-size="36" font-weight="400">2</text><rect x="375" y="150" width="82" height="82" rx="10" fill="#182230" stroke="#6B7F96"/><text x="405" y="204" fill="#F2F5F8" font-size="36" font-weight="400">3</text><rect x="480" y="150" width="82" height="82" rx="10" fill="#203849" stroke="#6B7F96"/><text x="510" y="204" fill="#F2F5F8" font-size="36" font-weight="400">4</text><rect x="60" y="280" width="82" height="82" rx="10" fill="#203849" stroke="#6B7F96"/><text x="90" y="334" fill="#F2F5F8" font-size="36" font-weight="400">1</text><rect x="165" y="280" width="82" height="82" rx="10" fill="#182230" stroke="#6B7F96"/><text x="195" y="334" fill="#F2F5F8" font-size="36" font-weight="400">2</text><rect x="270" y="280" width="82" height="82" rx="10" fill="#182230" stroke="#6B7F96"/><text x="300" y="334" fill="#F2F5F8" font-size="36" font-weight="400">1</text><rect x="375" y="280" width="82" height="82" rx="10" fill="#182230" stroke="#6B7F96"/><text x="405" y="334" fill="#F2F5F8" font-size="36" font-weight="400">4</text><rect x="480" y="280" width="82" height="82" rx="10" fill="#203849" stroke="#6B7F96"/><text x="510" y="334" fill="#F2F5F8" font-size="36" font-weight="400">4</text><rect x="670" y="150" width="465" height="105" rx="12" fill="#182230" stroke="#6B7F96"/><text x="690" y="188" fill="#8BD5FF" font-size="24" font-weight="600">1. Mark exact matches</text><text x="690" y="224" fill="#A5B2C1" font-size="19" font-weight="400">2 positions match before digit reuse</text><rect x="670" y="285" width="465" height="105" rx="12" fill="#182230" stroke="#6B7F96"/><text x="690" y="323" fill="#8BD5FF" font-size="24" font-weight="600">2. Match unused digits</text><text x="690" y="359" fill="#A5B2C1" font-size="19" font-weight="400">Each remaining digit is used once</text><rect x="60" y="460" width="1075" height="125" rx="12" fill="#182230" stroke="#6B7F96"/><text x="80" y="498" fill="#8BD5FF" font-size="24" font-weight="600">Response: 2 exact + 2 misplaced</text><text x="80" y="534" fill="#A5B2C1" font-size="19" font-weight="400">A worked illustration of checkCorrect / checkIncorrect; not an executed C++ test.</text><text x="48" y="678" fill="#A5B2C1" font-size="18" font-weight="400">Source: code.cpp and mastermind.cpp, Parts A/B. Illustration, not gameplay output.</text></g></svg>