<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Flip: a card game built on a linked list</title><desc id="desc">Source: Deck.cpp and Flip.cpp, Parts A/B. Structural illustration; no runtime counts measured.</desc><rect width="1200" height="720" rx="18" fill="#121A24"/><g font-family="Arial, sans-serif"><text x="48" y="60" fill="#F2F5F8" font-size="32" font-weight="600">Flip: a card game built on a linked list</text><rect x="55" y="135" width="340" height="110" rx="12" fill="#182230" stroke="#6B7F96"/><text x="75" y="173" fill="#8BD5FF" font-size="24" font-weight="600">Deck: 52 card nodes</text><text x="75" y="209" fill="#A5B2C1" font-size="19" font-weight="400">Card value + suit + next pointer</text><text x="425" y="203" fill="#8BD5FF" font-size="52" font-weight="400">→</text><rect x="510" y="135" width="300" height="110" rx="12" fill="#182230" stroke="#6B7F96"/><text x="530" y="173" fill="#8BD5FF" font-size="24" font-weight="600">deal()</text><text x="530" y="209" fill="#A5B2C1" font-size="19" font-weight="400">Detach the front node</text><text x="845" y="203" fill="#8BD5FF" font-size="52" font-weight="400">→</text><rect x="930" y="135" width="215" height="110" rx="12" fill="#182230" stroke="#6B7F96"/><text x="950" y="173" fill="#8BD5FF" font-size="24" font-weight="600">replace()</text><text x="950" y="209" fill="#A5B2C1" font-size="19" font-weight="400">Append node</text><rect x="55" y="325" width="510" height="120" rx="12" fill="#182230" stroke="#6B7F96"/><text x="75" y="363" fill="#8BD5FF" font-size="24" font-weight="600">24 nodes move into the hand</text><text x="75" y="399" fill="#A5B2C1" font-size="19" font-weight="400">The source initializes a separate empty Deck.</text><rect x="620" y="325" width="525" height="120" rx="12" fill="#182230" stroke="#6B7F96"/><text x="640" y="363" fill="#8BD5FF" font-size="24" font-weight="600">Flip → score → delete node</text><text x="640" y="399" fill="#A5B2C1" font-size="19" font-weight="400">The remaining deck keeps the other 28 nodes.</text><text x="60" y="535" fill="#F2F5F8" font-size="25" font-weight="400">Copy constructor + assignment make separate node chains.</text><text x="60" y="582" fill="#F2F5F8" font-size="25" font-weight="400">The destructor clears the owned chain.</text><text x="48" y="678" fill="#A5B2C1" font-size="18" font-weight="400">Source: Deck.cpp and Flip.cpp, Parts A/B. Structural illustration; no runtime counts measured.</text></g></svg>