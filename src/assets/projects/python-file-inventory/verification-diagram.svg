<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Inventory: a verified file round trip</title><desc id="desc">New verification on supplied demo data and labeled harness inputs · 2026-10-25.</desc><rect width="1200" height="720" rx="18" fill="#121A24"/><g font-family="Arial,sans-serif"><text x="48" y="64" fill="#F2F5F8" font-size="32">Inventory: a verified file round trip</text><rect x="48" y="125" width="530" height="130" rx="12" fill="#182230" stroke="#6B7F96"/><text x="70" y="164" fill="#8BD5FF" font-size="26">Load the supplied demo records</text><text x="70" y="205" fill="#A5B2C1" font-size="21">4 records in generated data.txt</text><rect x="622" y="125" width="530" height="130" rx="12" fill="#182230" stroke="#6B7F96"/><text x="644" y="164" fill="#8BD5FF" font-size="26">Query and calculate</text><text x="644" y="205" fill="#A5B2C1" font-size="21">Original total_value() → $8,762.29</text><rect x="48" y="295" width="530" height="130" rx="12" fill="#182230" stroke="#6B7F96"/><text x="70" y="334" fill="#8BD5FF" font-size="26">Append and update</text><text x="70" y="375" fill="#A5B2C1" font-size="21">Verification record: quantity 4 → 7</text><rect x="622" y="295" width="530" height="130" rx="12" fill="#182230" stroke="#6B7F96"/><text x="644" y="334" fill="#8BD5FF" font-size="26">Sort, save, and reload</text><text x="644" y="375" fill="#A5B2C1" font-size="21">5 records retained in ascending price order</text><text x="55" y="505" fill="#F2F5F8" font-size="27">Source input → dictionaries → queries / edits → text file</text><text x="55" y="554" fill="#A5B2C1" font-size="23">Only isolated verification copies were modified; original submissions are unchanged.</text><text x="48" y="674" fill="#A5B2C1" font-size="19">New verification on supplied demo data and labeled harness inputs · 2026-10-25.</text></g></svg>